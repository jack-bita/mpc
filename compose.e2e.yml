# compose.e2e.yml: the server the browser tests talk to (UI-6, 03 §11).
# It owns two services, which scripts/run_e2e.sh starts and wipes on every run:
#   - postgres: a fresh, empty PostgreSQL 18, kept in memory, so each run starts from nothing;
#   - backend:  the backend image that `make build-image` makes (mpc-backend:check), started the way the
#               demo starts: migrations, cache tables, then gunicorn (backend/start-demo.sh). It serves the
#               API and the built app from one address, http://localhost:8090, as on the demo (03 §13).
# Every value below is a throwaway for this one test database on this one machine. None is a secret, and
# real shop data never comes near it (ops rule).
#
# Start: docker compose -f compose.e2e.yml up --detach --wait
# Stop:  docker compose -f compose.e2e.yml down --volumes

# Its own project name: these containers never touch mpc-dev's, nor its database volume.
name: mpc-e2e

services:
  postgres:
    # The same tag as compose.dev.yml and ci.yml: scripts/test_same_postgres.py keeps the three equal.
    image: postgres:18.6-alpine
    # Not root (ops rule), as in compose.dev.yml.
    user: postgres
    environment:
      POSTGRES_DB: mpc
      POSTGRES_USER: mpc
      POSTGRES_PASSWORD: e2e-only-not-a-secret
    # The data in memory (tmpfs), not on disk: every run starts from an empty database and leaves nothing
    # behind. A test database has no need to survive a restart. No port is published: only the backend,
    # on Compose's own network, reaches it.
    tmpfs:
      - /var/lib/postgresql
    # The same check as compose.dev.yml's, which says why it asks over TCP.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mpc -d mpc"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    # Built on this machine by `make build-image`, never pulled: without this line, a missing image would
    # send Compose to Docker Hub for a name that isn't there.
    image: mpc-backend:check
    pull_policy: never
    # The demo's start (backend/start-demo.sh): the migrations and the cache tables first, then gunicorn.
    # The database is new on every run, as the demo's is every 30 days, so the migrations run in full.
    command: ["sh", "start-demo.sh"]
    environment:
      DJANGO_SECRET_KEY: e2e-only-not-a-secret
      PIN_PEPPER: e2e-only-not-a-secret
      # The address the tests open (frontend/playwright.config.ts). Django refuses any other Host.
      DJANGO_ALLOWED_HOSTS: localhost
      DB_NAME: mpc
      DB_USER: mpc
      DB_PASSWORD: e2e-only-not-a-secret
      # The postgres service, by its name on Compose's network.
      DB_HOST: postgres
      # The mark that lets backend/tests/e2e_shop.py make the tests' shop, whose manager's password is public. Set
      # here alone: the demo and the real server never have it, so the file refuses to run there.
      E2E_SHOP: "yes"
    ports:
      # 127.0.0.1 only: no other computer reaches it. 8090 is free beside `make dev`.
      - "127.0.0.1:8090:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # "Healthy" once gunicorn answers /api/health/, so `up --wait` returns only when the tests can start.
    # start-demo.sh runs the migrations before gunicorn, so an answer means they are done. Python, not
    # curl: the slim image has no curl. localhost, not 127.0.0.1, which Django would refuse as a Host.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=2)"
      interval: 2s
      timeout: 5s
      # Up to 3 minutes: every migration runs on the empty database first.
      retries: 90
