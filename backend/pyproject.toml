# pyproject.toml — the backend's Python project: its name, the Python it needs and its dependencies.
#
# uv reads this file and writes uv.lock, the exact version of every package. Change dependencies only
# with `uv add` / `uv remove`, never by hand in uv.lock (ADR-0025): the lock file is
# what makes Jack's laptop, CI and the server install the very same packages.
# Every new dependency needs Jack's yes first, with the reason.
#
# `.python-version` beside this file pins Python 3.14 (03 §3: `uuid.uuid7()`). It holds only the version,
# with no comment, because other tools read it too (uv itself, on laptops and in CI; pyenv) and may not skip one.
# backend/Dockerfile's python image is the same 3.14: the two move together.

[project]
name = "mpc-backend"
version = "0.1.0"
description = "Backend of the MPC shop system: Django + DRF, the API and the posting services."
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2,<6.2",
    "django-stubs-ext>=6.1.2",
    "djangorestframework>=3.18",
    "gunicorn>=26.2.0",
    "phonenumbers>=9.0.41",
    "psycopg[binary]>=3.3",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs[compatible-mypy]>=3.18.1",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

# --- uv itself: one version for every laptop and for CI, which reads this line too (ci.yml,
# `version-file`). Before 1.0, a minor release of uv may change how it locks or installs, so a new
# uv must never arrive on its own. uv refuses to run with another version and names this line.
# Upgrade on purpose, as its own small task: install the new uv, change this line and the uv image
# tag in backend/Dockerfile, run `make check`.
[tool.uv]
required-version = "==0.11.33"

# --- ruff: lint (find likely bugs) and format (one code style), in one fast tool.
[tool.ruff]
target-version = "py314"
# Longer than ruff's 88: our code carries many why-comments, and 120 keeps them on one line.
line-length = 120

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes (unused or undefined names) · I import order · UP modern Python ·
# B likely bugs (bugbear) · DJ Django pitfalls · SIM simpler code.
select = ["E", "W", "F", "I", "UP", "B", "DJ", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Django writes the migrations, and its own help texts are long single strings that can't be split.
# Every other rule, and the formatter, still apply to them.
"*/migrations/*" = ["E501"]

# --- mypy: checks the types, so a wrong argument is caught before it runs.
[tool.mypy]
# Strict from day one: it costs nothing on an empty project and is hard to switch on later.
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
# The plugin loads Django to learn the models; the test settings need no secrets to load.
django_settings_module = "config.settings.test"

# --- pytest: runs the tests. pytest-django finds manage.py next to this file, puts backend/ on the
# import path, and loads the settings below. The database's port and password come from the root
# .env: `uv run --env-file ../.env pytest`, or `make test`, which adds it for you.
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
# A typo in a marker name (@pytest.mark.djnago_db) is an error, not a silently skipped rule.
addopts = "--strict-markers"

# --- coverage: which lines the tests ran. `make check` (and so CI) prints the report (REPO-5);
# plain `pytest` and `make test` skip it to stay fast. Turn it on with `pytest --cov`.
[tool.coverage.run]
# Measure our code only, not Django or the other installed packages.
source = ["apps", "config"]
# Branch coverage also counts each side of an `if`: a test that only takes the happy path shows up.
branch = true
# Tests and migrations would only make the number look better: they run by definition.
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
# List the line numbers no test ran, and hide files that are fully covered, so the gaps stand out.
# No `fail_under` yet: the ≥ 90% rule is for services and calculations (03 §11), and none exist so far.
show_missing = true
skip_covered = true

# --- import-linter: turns the layers of 03 §5.1 into a check (ADR-0035). An app may import only
# from the apps below it, so every dependency points down: a change in `sales` can't break `core`,
# and two apps can never import each other in a circle. It reads the import lines without running
# the code. `make check` (and so CI) runs it as `lint-imports`.
[tool.importlinter]
# The package whose imports are checked: the 13 apps. Their tests (apps/*/tests/) and imports under
# `if TYPE_CHECKING:` count too: import-linter's defaults. So a test that needs a higher layer's rows
# gets them from a fixture in backend/conftest.py, which is outside `apps`. Whether type-only imports
# should count is decided in CORE-2 (`exclude_type_checking_imports`).
root_package = "apps"

[[tool.importlinter.contracts]]
name = "Apps import only from lower layers (03 §5.1)"
type = "layers"
# The layers are the apps inside `apps`, so below, `core` means `apps.core`.
containers = ["apps"]
# Top to bottom, one line per layer of the table in 03 §5.1. `|` puts apps on the same layer;
# they may not import each other either, apart from the exceptions in `ignore_imports`.
layers = [
    "sync | reports",              # 6
    "sales | services | staffpay", # 5
    "inventory | money",           # 4
    "catalog | contacts",          # 3
    "people",                      # 2
    "shops",                       # 1
    "core | control",              # 0
]
# Every app inside `apps` must have a layer above. A new app without one turns the check red,
# so it can't skip the table.
exhaustive = true
# The three same-layer imports that 03 §5.1 allows. These take full names, unlike the layers.
# `**` means any module inside the app, but not the app package itself: code goes in modules such
# as models.py, never in an app's `__init__.py`.
ignore_imports = [
    "apps.control.** -> apps.core.**",     # every app writes to control, so it builds only on core
    "apps.inventory.** -> apps.money.**",  # deliveries pay suppliers
    "apps.services.** -> apps.sales.**",   # a job's bill is a sale
]
# By default, an ignore line that matches no import is an error, and no code uses these yet.
# Turning that off is safe: a line that matches nothing can only make the check stricter.
# Once code uses all three, delete this line: the default then reports a typo in an exception at once.
unmatched_ignore_imports_alerting = "none"
