# dependabot.yml: GitHub's Dependabot proposes version updates as pull requests (REPO-5, 03 §12).
# It owns which package lists are watched and how often. Every version here is pinned (lock files,
# image tags, action commits), so nothing moves on its own; this file is how they move on purpose,
# one tested pull request at a time. CI runs on each one like on any other PR.
#
# GitHub reads this file only from `main`: after a change, check Insights → Dependency graph →
# Dependabot to see that each entry ran.
#
# Same for every entry:
# - Weekly, on Monday morning shop time, so updates arrive at the start of the week.
# - Minor and patch updates come grouped in one PR per entry; a major version comes alone, because
#   it may break things and is an upgrade task of its own (04 risks: "upgrades as their own tasks").
# - A cooldown: a version must be a few days old before it is proposed. A hijacked package is
#   usually found and pulled within days, and this keeps it from ever reaching a PR.
# - Titles like `build(deps): bump django from 6.1.2 to 6.1.3`: a conventional commit (04 §3.5),
#   since the PR title becomes the squash commit on main.
# - The `type:chore` label of 04 §4, so the PRs sort with the rest of the board.

version: 2

updates:
  # The backend's Python packages: backend/pyproject.toml and backend/uv.lock.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Dar_es_Salaam
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    labels: ["type:chore"]

  # The frontend's packages: frontend/package.json and frontend/pnpm-lock.yaml. Dependabot calls
  # every JavaScript package manager "npm" and reads pnpm's lock file under that name.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Dar_es_Salaam
    cooldown:
      default-days: 7
    groups:
      js-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    labels: ["type:chore"]

  # The actions in .github/workflows/: it updates both the pinned commit and its `# vX.Y.Z` comment.
  # Not the postgres image inside ci.yml: no entry reads images there, so it moves by hand,
  # together with compose.dev.yml's (the comment in ci.yml says so).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Dar_es_Salaam
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
    labels: ["type:chore"]

  # The images in compose.dev.yml (postgres, caddy). The Dockerfiles of OPS-1 will need a
  # `docker` entry of their own when they arrive.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Dar_es_Salaam
    cooldown:
      default-days: 7
    groups:
      images-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    labels: ["type:chore"]
