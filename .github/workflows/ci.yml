# ci.yml: the checks every pull request must pass before it can merge into main (REPO-5, 03 §12).
# It owns the CI jobs, one per part of `make check`:
#   - backend:  `make check-backend`, with a PostgreSQL 18 service beside it
#   - frontend: `make check-frontend`
#   - image:    `make check-image`: build the backend image, start it, check that it serves (OPS-1)
#   - e2e:      `make check-e2e`: the browser tests, against that image and a fresh PostgreSQL (UI-6)
# The four run side by side, each on its own fresh machine. The list of checks lives in the
# Makefile, not here: this file only prepares a clean machine and calls the same target a laptop
# runs, so the two can't drift apart (ops rule).
#
# Each job's name is also the name of its check on a pull request, and the ruleset requires all
# four by those names (.github/rulesets/main.json). Rename a job only together with the ruleset,
# or every merge waits for a check that never comes.

name: CI

on:
  pull_request:
  # main is checked too, after each merge. Two reasons: a red main shows at once, and GitHub lets
  # pull requests read caches saved on main, but not caches saved by another pull request.
  push:
    branches: [main]

# The default token can only read the repo: no job here writes anything to GitHub.
permissions:
  contents: read

# A new push to a pull request cancels its older run, which would only report on stale code: one
# group per pull request. On main, each merge gets a group of its own, named by its commit, so no
# run there is ever cancelled or replaced. (One shared group would not be enough: a group keeps one
# running and one waiting run, and a newer waiting run replaces the older one.)
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    # Pinned like the images (ops rule): `ubuntu-latest` moves to a new Ubuntu on GitHub's schedule.
    runs-on: ubuntu-24.04
    # A hung test would otherwise hold the runner for GitHub's default of 6 hours.
    timeout-minutes: 15

    # A service container: GitHub starts it before the first step and removes it after the last.
    # Tests run on real PostgreSQL, never SQLite (03 §11).
    services:
      postgres:
        # The same tag as compose.dev.yml, so CI tests on the PostgreSQL every laptop runs.
        # Dependabot updates the compose files (compose.dev.yml, compose.e2e.yml), never this line;
        # scripts/test_same_postgres.py keeps CI red until this line matches them.
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: mpc
          POSTGRES_USER: mpc
          # Not a secret: this database lives only for this one job, holds only test data, and is
          # reachable only from this runner. A real secret would come from GitHub secrets (ops rule).
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        # --user: start as `postgres`, never root (ops rule), as in compose.dev.yml.
        # --health-*: the steps wait until the container is healthy. pg_isready over TCP (-h), the
        # way Django connects, for the same reason as in compose.dev.yml.
        options: >-
          --user postgres
          --health-cmd "pg_isready -h 127.0.0.1 -U mpc -d mpc"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    # The settings read these (config/settings/base.py). CI has no .env file; the Makefile only
    # passes --env-file when one exists.
    env:
      DB_NAME: mpc
      DB_USER: mpc
      DB_PASSWORD: ci-only-not-a-secret
      # 127.0.0.1, not localhost, as in .env.example: the port is published on IPv4.
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      # Each action is pinned to the exact commit of a release, with the version in the comment.
      # A tag like `v7` can be moved to other code; a commit can't. Dependabot updates both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config: no step here pushes, so none needs it.
          persist-credentials: false

      # uv installs the Python in backend/.python-version (3.14) and the packages in uv.lock.
      # version-file: the uv version comes from `required-version` in pyproject.toml, so CI runs the
      # laptop's uv, not whatever is newest today.
      # Its download cache is saved between runs, keyed on uv.lock: a new lock starts a new cache.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: backend/pyproject.toml
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # The target's first line installs the packages with `uv sync --locked`, which fails if uv.lock
      # doesn't match pyproject.toml (Makefile). So there is no install step here: one list, in make.
      - name: Run the backend checks
        run: make check-backend

  frontend:
    # Pinned, with a time limit, for the same reasons as the backend job.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm before Node: setup-node's pnpm cache asks pnpm where its package store is.
      # No version here: it comes from "packageManager" in frontend/package.json, so the laptop
      # and CI run the very same pnpm.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      # Node 24, the oldest version package.json allows ("engines"), and the major of the node
      # image in backend/Dockerfile: the three move together, by hand. The pnpm store is saved
      # between runs, keyed on pnpm-lock.yaml: a new lock starts a new cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Installs first with `pnpm install --frozen-lockfile`, which fails if pnpm-lock.yaml doesn't
      # match package.json (Makefile), then runs the checks.
      - name: Run the frontend checks
        run: make check-frontend

  # Named `image`, none of `backend`, `frontend` and `pr-title`: a second job with one of their
  # names would make the ruleset ambiguous (04 OPS-1). It is a required check too: from OPS-2 on,
  # every merge deploys the demo, so a broken image must block the merge.
  image:
    # Pinned, with a time limit, for the same reasons as the backend job. Each run builds from
    # scratch (no layer cache is kept between runs): the base images and every package are
    # downloaded again, a few minutes on GitHub's network.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub's Ubuntu machines come with Docker and curl, so nothing to set up: the job calls the
      # same target a laptop runs.
      - name: Build and check the backend image
        run: make check-image

  # The browser tests (UI-6, 03 §11): Playwright drives a real Chromium through the counter's way in,
  # against the backend image and a fresh PostgreSQL, both in Docker (compose.e2e.yml). A change that
  # breaks pairing or the PIN login turns this red before the merge, instead of at the counter.
  # A job of its own, not steps of `image`: its name says what broke, and the two run side by side.
  # The cost: this job builds the image again on its own machine, a few minutes, in parallel.
  e2e:
    # Pinned like the other jobs. 20 minutes, not 15: the image build alone takes most of `image`'s
    # time, and the tests come after it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm and Node as in the frontend job, which says why in this order: Playwright is a frontend
      # package, and its runner is Node.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The system libraries Playwright's Chromium needs (fonts, graphics), with apt. A step of this
      # job, not of make: apt needs sudo, which GitHub's machines give without a password and a laptop
      # must never be asked for in the middle of `make check` (the Makefile says how a laptop gets them).
      # Playwright's own command knows the list, so the packages come first.
      - name: Install the browser's system libraries
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install-deps chromium

      - name: Run the browser tests
        run: make check-e2e

      # Only when a test failed: Playwright's HTML report, with each failed test's trace and screenshot,
      # to download from the run's page. The repo is public, so anyone may download it: it holds the
      # test's made-up shop only, as all of CI does (ops rule). Kept 7 days, long enough to look.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
